name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm build

      - name: Generate Index Page
        run: |
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Axhub Make 原型索引</title>
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <style>
              body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 40px 20px; }
              .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
              h1 { text-align: center; color: #333; }
              .list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
              a { display: block; padding: 12px 16px; background: #fafafa; border: 1px solid #e8e8e8; border-radius: 4px; text-decoration: none; color: #1890ff; font-weight: 500; transition: all 0.3s; }
              a:hover { background: #e6f7ff; border-color: #91d5ff; transform: translateX(5px); }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Axhub Make 原型预览</h1>
              <p style="text-align: center; color: #666;">点击下方链接访问对应的页面</p>
              <div class="list">
                <a href="./prototypes/home.html">🏠 前台门户首页 (Home)</a>
                <a href="./prototypes/login.html">🔑 登录页 (Login)</a>
                <a href="./prototypes/admin-demand.html">📊 运营后台 - 需求管理</a>
                <a href="./prototypes/my-service.html">💼 服务商后台 - 我的服务</a>
                <a href="./prototypes/flight-dynamic.html">✈️ 低空飞行动态监控</a>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
